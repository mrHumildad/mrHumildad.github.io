name: Refresh GitHub stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate stats.json and assets/js/stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-stats.mjs

      - name: Render static fallback
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 scripts/render-stats-fallback.py

      - name: Commit when it changed
        run: |
          if git diff --quiet -- stats.json assets/js/stats.js assets/img/stats-fallback.png; then
            echo "stats unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json assets/js/stats.js assets/img/stats-fallback.png
          git commit -m "chore(stats): refresh GitHub stats"
          git push
